      <rect x="61.5" y="44" width="7" height="3" rx="0.8" />
      <path d="M 60.5,37 C 59.8,40.5 62,44 63,47" fill="none" stroke="#061d3b" stroke-width="1.4" stroke-linecap="round" />
      <rect x="63" y="45" width="4" height="9" />
      <rect x="50" y="50" width="30" height="5" rx="0.5" />
      <rect x="49" y="49" width="3" height="7" rx="0.5" fill="#061d3b" />
      <rect x="49.8" y="50" width="1" height="5" fill="#ffffff" />
      <rect x="78" y="49" width="3" height="7" rx="0.5" fill="#061d3b" />
