      <line x1="77" y1="34" x2="77" y2="30" stroke-width="1.2" stroke-linecap="round" />
      <line x1="82" y1="35" x2="85" y2="32" stroke-width="1.2" stroke-linecap="round" />
      <line x1="85" y1="39" x2="89" y2="37" stroke-width="1.2" stroke-linecap="round" />
      <line x1="86" y1="44" x2="91" y2="44" stroke-width="1.2" stroke-linecap="round" />
      <line x1="85" y1="49" x2="89" y2="51" stroke-width="1.2" stroke-linecap="round" />
      <line x1="72" y1="35" x2="70" y2="32" stroke-width="1.2" stroke-linecap="round" />
