    <circle cx="65" cy="65" r="63" fill="#061d3b" />
    <circle cx="65" cy="65" r="61" fill="#ffffff" />
    <circle cx="65" cy="65" r="59.5" fill="#061d3b" />
    <circle cx="65" cy="65" r="58" fill="#ffffff" />

    <!-- Inner Illustration Enclosure -->
    <circle cx="65" cy="65" r="39" fill="#061d3b" />
    <circle cx="65" cy="65" r="37.5" fill="#ffffff" />

    <!-- Curved Text on Outer Ring -->
    <text font-family="'Fraunces', 'DM Serif Display', 'Georgia', serif" font-size="13.5" font-weight="900" fill="#061d3b" letter-spacing="2.6">
      <textPath href="#crestHdrTopPath" startOffset="50%" text-anchor="middle">LYONSKYE</textPath>
    </text>

