  <!-- ================= TYPOGRAPHY ================= -->
  <g transform="translate(150, 0)">
    <text x="0" y="74" font-family="'Fraunces', 'DM Serif Display', 'Georgia', serif" font-size="46" font-weight="900" fill="#061d3b" letter-spacing="4">LYONSKYE</text>
    <text x="2" y="106" font-family="'Fraunces', 'DM Serif Display', 'Georgia', serif" font-size="18" font-weight="800" fill="#061d3b" letter-spacing="4.5">OFFSHORE MARINE LTD.</text>
  </g>
