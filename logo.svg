      <path d="M 78,68 C 81,70 84,67 87,69 C 91,71 94,66 99,68" />
      <path d="M 79,73 C 82,75 84,72 87,74 C 91,76 94,71 98,73" />
      <path d="M 79,78 C 81,80 84,77 86,78 C 90,80 93,76 97,78" />
