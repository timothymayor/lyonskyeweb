      <path d="M 31,68 C 35,66 38,71 42,69 C 45,67 48,70 52,68" />
      <path d="M 32,73 C 36,71 39,76 43,74 C 46,72 49,75 51,73" />
      <path d="M 33,78 C 37,76 40,80 44,78 C 47,76 49,79 51,78" />

