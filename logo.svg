<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140">
  <defs>
    <path id="crestHdrTopPath" d="M 18,70 A 50,50 0 0,1 122,70" fill="none" />
    <path id="crestHdrBottomPath" d="M 122,70 A 50,50 0 0,1 18,70" fill="none" />
  </defs>

  <!-- ================= CREST (0,0 to 140,140) ================= -->
  <g transform="translate(5, 5)">
