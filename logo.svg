      <path d="M 34,75 L 39,78 L 41,72 Z" />
      <path d="M 96,75 L 91,78 L 89,72 Z" />
    </g>

    <!-- Lion Head Profile -->
    <g id="lion-hdr">
      <path d="M 61,54 
               C 56,52 50,55 47,60 
               C 44,65 44,70 43,75 
               C 42,80 43,85 46,89 
               C 49,93 53,96 58,98 
               C 63,100 66,98 68,96 
               C 71,93 73,88 74,84 
               C 75,81 77,80 80,80 
               C 83,79 84,77 85,74 
               C 85,71 83,68 85,65 
               C 85,63 84,61 83,60 
               C 80,59 78,60 76,61 
               C 74,59 72,58 69,57 
               C 66,56 64,55 61,54 Z" 
            fill="#061d3b" stroke="#061d3b" stroke-width="0.5" stroke-linejoin="round" />

      <!-- Lion Face White Highlights -->
      <path d="M 67,62 
               C 69,62 70,63 71,64 
               C 73,65 75,66 77,67 
               C 79,68 81,69 82,70 
               C 83,71 84,72 83,73 
               C 83,74 81,75 80,75 
               C 78,75 77,77 76,77 
               C 74,78 72,77 70,77 
               C 71,79 72,81 73,83 
               C 71,82 69,80 68,78 
               C 67,77 66,76 65,75 
               C 65,73 65,71 66,70 
               C 65,69 65,67 65,66 
               C 66,64 66,63 67,62 Z" 
            fill="#ffffff" />

      <ellipse cx="74.5" cy="68" rx="1.3" ry="0.9" fill="#061d3b" />
      <path d="M 72.5,66 Q 75,65 77,67" fill="none" stroke="#061d3b" stroke-width="0.9" stroke-linecap="round" />
      <path d="M 81.5,70 L 83.5,71 L 82,72.5 Z" fill="#061d3b" />
      <path d="M 81.5,72 Q 79,73 78,72.5" fill="none" stroke="#061d3b" stroke-width="0.8" stroke-linecap="round" />

      <!-- Mane Strands -->
      <g fill="none" stroke="#ffffff" stroke-linecap="round">
        <path d="M 58,58 Q 63,60 65,66" stroke-width="1.2" />
        <path d="M 53,63 Q 59,66 62,73" stroke-width="1.3" />
        <path d="M 50,69 Q 57,72 60,80" stroke-width="1.4" />
        <path d="M 49,76 Q 55,79 58,87" stroke-width="1.4" />
        <path d="M 51,84 Q 57,87 61,93" stroke-width="1.3" />
      </g>
