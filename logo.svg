      <path d="M 38,51 Q 40.5,48.5 43,51 Q 45.5,48.5 48,51" stroke-width="1.2" />
      <path d="M 83,53 Q 85.5,51 88,53 Q 90.5,51 93,53" stroke-width="1.1" />
